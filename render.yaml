services:
  - type: web
    name: slack-ai-customer-fit-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: SLACK_BOT_TOKEN
        sync: false

      - key: SLACK_APP_TOKEN
        sync: false

      - key: SLACK_SIGNING_SECRET
        sync: false

      - key: SLACK_PRIVATE_CHANNEL_ID
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: COMPANY_NAME
        value: Your Company Name

      - key: COMPANY_PRODUCT
        value: Your Commercial Product

    healthCheckPath: /health
